name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE-*']  # docs-only changes don't need CI
  pull_request:
    paths-ignore: ['**.md', 'LICENSE-*']  # docs-only changes don't need CI

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate vendored spec
        run: uv run --no-project --with pyyaml --with jsonschema python .kit/validate.py .spec

      - name: Check (raises tracking, no warnings)
        run: nim check --hints:off src/polyline.nim

      - name: Unit tests and conformance
        run: nimble test

      - name: Canonical examples
        run: nimble examples

      - name: Short fuzz run
        run: FUZZ_SECONDS=30 nimble fuzz

      - name: Benchmark runs and round-trips the input (timings not recorded from CI)
        run: nimble bench
